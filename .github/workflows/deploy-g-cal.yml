name: Deploy Google Calendar Importer to Cloud Run

on:
  workflow_call:
    inputs:
      image_tag:
        description: Custom image tag (default: commit SHA)
        type: string
        required: false
  workflow_dispatch:
    inputs:
      image_tag:
        description: Custom image tag (default: commit SHA)
        required: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-west1
  SERVICE_NAME: google-calendar-import
  ARTIFACT_REGISTRY_REPO: cyclescene
  IMAGE_NAME: g-cal

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run linting
        working-directory: backend
        run: go vet ./cmd/g-cal ./internal/scraper

      - name: Run tests
        working-directory: backend
        run: go test ./cmd/g-cal ./internal/scraper -v

      - name: Set image tag
        id: image-tag
        run: |
          INPUT_TAG="${{ github.event.inputs.image_tag }}${{ inputs.image_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docker image
        working-directory: backend/cmd/g-cal
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.IMAGE_NAME }}:latest \
            -f Dockerfile \
            ../../

      - name: Push Docker image to Artifact Registry
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.IMAGE_NAME }}:latest

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: Deploy with OpenTofu
        working-directory: backend/cmd/g-cal/infra
        env:
          TF_VAR_google_calendars: ${{ secrets.GOOGLE_CALENDARS }}
          TF_VAR_turso_db_url: ${{ secrets.TURSO_DB_URL }}
          TF_VAR_turso_db_rw_token: ${{ secrets.TURSO_DB_RW_TOKEN }}
        run: |
          tofu init \
            -backend-config="bucket=${{ env.PROJECT_ID }}-terraform-state" \
            -backend-config="prefix=services/g-cal"
          tofu apply \
            -var="image_tag=${{ steps.image-tag.outputs.tag }}" \
            -auto-approve

      - name: Verify job deployment
        run: |
          gcloud run jobs describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(name)'

      - name: Deployment summary
        if: always()
        run: |
          echo "Google Calendar importer deployed"
          echo "Job: ${{ env.SERVICE_NAME }}"
          echo "Region: ${{ env.REGION }}"
          echo "Image tag: ${{ steps.image-tag.outputs.tag }}"
