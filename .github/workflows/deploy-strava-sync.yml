name: Deploy Strava Sync to Cloud Run

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Custom image tag (default: commit SHA)'
        type: string
        required: false
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom image tag (default: commit SHA)'
        required: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-west1
  SERVICE_NAME: strava-sync
  ARTIFACT_REGISTRY_REPO: cyclescene
  IMAGE_NAME: strava-sync

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: 'backend/go.sum'

      - name: Run linting
        working-directory: backend
        run: go vet ./...
        continue-on-error: true

      - name: Run tests
        working-directory: backend
        run: go test ./... -v
        continue-on-error: true

      - name: Set image tag
        id: image-tag
        run: |
          # Support both workflow_dispatch and workflow_call inputs
          INPUT_TAG="${{ github.event.inputs.image_tag }}${{ inputs.image_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docker image
        working-directory: backend/cmd/strava-sync
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.IMAGE_NAME }}:latest \
            -f Dockerfile \
            ../../

      - name: Push Docker image to Artifact Registry
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.IMAGE_NAME }}:latest

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: Deploy with OpenTofu
        working-directory: backend/cmd/strava-sync/infra
        env:
          TF_VAR_project_id: ${{ env.PROJECT_ID }}
          TF_VAR_turso_url: ${{ secrets.TURSO_DB_URL }}
          TF_VAR_turso_auth_token: ${{ secrets.TURSO_DB_RW_TOKEN }}
          TF_VAR_turso_monitoring_url: ${{ secrets.TURSO_MONITORING_DB_URL }}
          TF_VAR_turso_monitoring_auth_token: ${{ secrets.TURSO_MONITORING_DB_RW_TOKEN }}
          TF_VAR_strava_client_id: ${{ secrets.STRAVA_CLIENT_ID }}
          TF_VAR_strava_client_secret: ${{ secrets.STRAVA_CLIENT_SECRET }}
          TF_VAR_strava_token_encryption_key: ${{ secrets.STRAVA_TOKEN_ENCRYPTION_KEY }}
          TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
          TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
        run: |
          tofu init \
            -backend-config="bucket=${{ env.PROJECT_ID }}-terraform-state" \
            -backend-config="prefix=services/strava-sync"
          tofu apply \
            -var="image_tag=${{ steps.image-tag.outputs.tag }}" \
            -auto-approve

      - name: Verify job deployment
        id: job-status
        run: |
          JOB=$(gcloud run jobs describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(name)')
          echo "job=$JOB" >> $GITHUB_OUTPUT
          echo "Job deployed: $JOB"

      - name: Get scheduler info
        id: scheduler-info
        run: |
          SCHEDULE=$(gcloud scheduler jobs describe strava-sync-trigger \
            --location=${{ env.REGION }} \
            --format='value(schedule)')
          echo "schedule=$SCHEDULE" >> $GITHUB_OUTPUT
          echo "Scheduler: $SCHEDULE"

      - name: Deployment summary
        if: always()
        run: |
          echo "✅ Strava Sync Deployment Summary"
          echo "=================================="
          echo "Job: ${{ env.SERVICE_NAME }}"
          echo "Region: ${{ env.REGION }}"
          echo "Image Tag: ${{ steps.image-tag.outputs.tag }}"
          echo "Schedule: ${{ steps.scheduler-info.outputs.schedule }}"
          echo "Status: Deployed (triggered by Cloud Scheduler)"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
